[project]
name = "product-ai-backend"
version = "0.1.0"
description = "Product AI Platform Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6.0",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.3",
    "drf-spectacular>=0.27",
    "django-environ>=0.11",
    "django-cors-headers>=4.4",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "pydantic>=2.8",
    "python-json-logger>=2.0",
    "groq>=0.11.0",
    "openai>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers"
